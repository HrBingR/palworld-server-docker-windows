---
services:
  palworld-windows:
    build:
      context: .
    image: palworld-server-docker-windows:milestone-1
    container_name: palworld-server-windows
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
      - "127.0.0.1:8212:8212/tcp"
    environment:
      PUID: 1000
      PGID: 1000
      PORT: 8211
      PUBLIC_PORT: 8211
      PLAYERS: 16
      SERVER_NAME: Palworld Windows Proton Test
      SERVER_PASSWORD: worldofpals
      ADMIN_PASSWORD: change-me
      REST_API_ENABLED: "true"
      REST_API_PORT: 8212
      RCON_ENABLED: "false"
      UPDATE_ON_BOOT: "true"
      MULTITHREADING: "true"
      TZ: Africa/Johannesburg
    volumes:
      - ./palworld-windows:/palworld
